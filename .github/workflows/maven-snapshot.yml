# Reusable snapshot publishing workflow for ZhiJun IO Maven projects
#
# Usage:
#   uses: zhijun-io/workflows/.github/workflows/maven-snapshot.yml@main
#   secrets: MAVEN_USERNAME, MAVEN_PASSWORD, MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE

name: Maven Publish Snapshot

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Maven project root directory'
        required: false
        type: string
        default: '.'
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
      java-distribution:
        description: 'Java distribution'
        required: false
        type: string
        default: 'temurin'
      use-maven-wrapper:
        description: 'Use ./mvnw when present; otherwise mvn'
        required: false
        type: boolean
        default: true
      skip-tests:
        description: 'Skip tests before publish'
        required: false
        type: boolean
        default: false
      verify-first:
        description: 'Run verify before deploy'
        required: false
        type: boolean
        default: true
      maven-profiles:
        description: 'Optional Maven profile(s) for verify and deploy (comma-separated)'
        required: false
        type: string
        default: ''
      maven-server-id:
        description: 'Maven server ID in settings.xml / pom'
        required: false
        type: string
        default: 'central'
      maven-extra-args:
        description: 'Extra Maven CLI arguments (default -B -ntp)'
        required: false
        type: string
        default: '-B -ntp'
    secrets:
      MAVEN_USERNAME:
        required: true
      MAVEN_PASSWORD:
        required: true
      MAVEN_GPG_PRIVATE_KEY:
        required: false
      MAVEN_GPG_PASSPHRASE:
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory == '.' && '**/pom.xml' || format('{0}/**/pom.xml', inputs.working-directory) }}
          server-id: ${{ inputs.maven-server-id }}
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish snapshot
        uses: zhijun-io/workflows/.github/actions/run-maven@main
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: deploy
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: true
          maven-profiles: ${{ inputs.maven-profiles }}
          extra-args: ${{ inputs.maven-extra-args }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

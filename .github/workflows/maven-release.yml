# Reusable Maven Central release workflow for ZhiJun IO projects
#
# Usage:
#   uses: zhijun-io/workflows/.github/workflows/maven-release.yml@main
#   with:
#     version: '0.1.0'
#     version-property: revision
#     java-version: '8'
#     use-maven-wrapper: false

name: Maven Central Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        type: string
      version-property:
        description: 'project-version (mvn versions:set) or revision (<revision> property)'
        required: false
        type: string
        default: 'project-version'
      pom-file:
        description: 'POM file relative to working-directory'
        required: false
        type: string
        default: 'pom.xml'
      working-directory:
        description: 'Maven project root directory'
        required: false
        type: string
        default: '.'
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '21'
      java-distribution:
        description: 'Java distribution to use'
        required: false
        type: string
        default: 'temurin'
      use-maven-wrapper:
        description: 'Use ./mvnw when present; otherwise mvn'
        required: false
        type: boolean
        default: true
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      verify-profiles:
        description: 'Maven profile for verify (e.g. coverage)'
        required: false
        type: string
        default: ''
      create-tag:
        description: 'Create and push Git tag'
        required: false
        type: boolean
        default: true
      tag-prefix:
        description: 'Tag prefix (e.g. v for v0.1.0)'
        required: false
        type: string
        default: 'v'
      bump-snapshot:
        description: 'Commit and push next SNAPSHOT development version'
        required: false
        type: boolean
        default: true
      default-branch:
        description: 'Branch to push tag and post-release SNAPSHOT bump'
        required: false
        type: string
        default: 'main'
    secrets:
      MAVEN_USERNAME:
        description: 'Maven Central username / Portal token username'
        required: true
      MAVEN_PASSWORD:
        description: 'Maven Central password / Portal token'
        required: true
      GPG_SECRET_KEY:
        description: 'GPG private key for signing'
        required: true
      GPG_PASSPHRASE:
        description: 'GPG passphrase'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        uses: zhijun-io/workflows/.github/actions/validate-release-version@main
        with:
          version: ${{ inputs.version }}
          tag-prefix: ${{ inputs.tag-prefix }}

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory == '.' && '**/pom.xml' || format('{0}/**/pom.xml', inputs.working-directory) }}
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set version
        uses: zhijun-io/workflows/.github/actions/set-project-version@main
        with:
          version: ${{ inputs.version }}
          version-property: ${{ inputs.version-property }}
          pom-file: ${{ inputs.pom-file }}
          working-directory: ${{ inputs.working-directory }}
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}

      - name: Verify project version matches release
        uses: zhijun-io/workflows/.github/actions/validate-release-version@main
        with:
          version: ${{ inputs.version }}
          version-property: ${{ inputs.version-property }}
          pom-file: ${{ inputs.pom-file }}
          working-directory: ${{ inputs.working-directory }}
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          tag-prefix: ${{ inputs.tag-prefix }}
          verify-project-version: 'true'

      - name: Verify no SNAPSHOT dependency versions
        uses: zhijun-io/workflows/.github/actions/verify-no-snapshot-versions@main
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Build and verify
        uses: zhijun-io/workflows/.github/actions/run-maven@main
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: clean verify
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: ${{ inputs.skip-tests }}
          maven-profiles: ${{ inputs.verify-profiles }}

      - name: Publish release to Maven Central
        uses: zhijun-io/workflows/.github/actions/run-maven@main
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: deploy
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: true
          maven-profiles: release
          threads: 1C
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Collect release artifacts
        if: ${{ inputs.create-tag }}
        id: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="${{ inputs.working-directory }}"
          mapfile -t FILES < <(
            find "$WORK_DIR" \( -path '*/target/*.jar' -o -path '*/target/*.pom' -o -path '*/target/*.asc' \) \
              ! -path '*/original/*' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              | sort -u
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "has-files=false" >> "$GITHUB_OUTPUT"
            echo "No release artifacts found under ${WORK_DIR}"
            exit 0
          fi
          {
            echo "has-files=true"
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        if: ${{ inputs.create-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ inputs.tag-prefix }}${{ inputs.version }} -m "Release ${{ inputs.tag-prefix }}${{ inputs.version }}"
          git push origin ${{ inputs.tag-prefix }}${{ inputs.version }}

      - name: Create GitHub Release
        if: ${{ inputs.create-tag && steps.release-artifacts.outputs.has-files != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-prefix }}${{ inputs.version }}
          name: ${{ inputs.tag-prefix }}${{ inputs.version }}
          draft: false
          prerelease: ${{ contains(inputs.version, '-') }}
          generate_release_notes: true

      - name: Create GitHub Release with artifacts
        if: ${{ inputs.create-tag && steps.release-artifacts.outputs.has-files == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-prefix }}${{ inputs.version }}
          name: ${{ inputs.tag-prefix }}${{ inputs.version }}
          draft: false
          prerelease: ${{ contains(inputs.version, '-') }}
          generate_release_notes: true
          files: ${{ steps.release-artifacts.outputs.files }}

      - name: Compute next SNAPSHOT version
        if: ${{ inputs.bump-snapshot && inputs.create-tag }}
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          IFS='.' read -r major minor patch <<< "${{ inputs.version }}"
          patch="${patch%%-*}"
          NEXT_VERSION="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          echo "next-version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumping to next development version: ${NEXT_VERSION}"

      - name: Apply next SNAPSHOT version
        if: ${{ inputs.bump-snapshot && inputs.create-tag }}
        uses: zhijun-io/workflows/.github/actions/set-project-version@main
        with:
          version: ${{ steps.bump.outputs.next-version }}
          version-property: ${{ inputs.version-property }}
          pom-file: ${{ inputs.pom-file }}
          working-directory: ${{ inputs.working-directory }}
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}

      - name: Commit and push next SNAPSHOT version
        if: ${{ inputs.bump-snapshot && inputs.create-tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit after SNAPSHOT bump; skipping push"
            exit 0
          fi
          git commit -m "chore: bump development version to ${{ steps.bump.outputs.next-version }}"
          git push origin HEAD:${{ inputs.default-branch }}

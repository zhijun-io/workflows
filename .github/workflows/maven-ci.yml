# Reusable CI workflow for ZhiJun IO Maven projects
#
# Minimal:
#   uses: zhijun-io/workflows/.github/workflows/maven-ci.yml@main
#
# With optional Maven profile(s) defined in your POM:
#   with:
#     java-version: '8'
#     maven-profiles: your-profile

name: Maven CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Maven project root directory'
        required: false
        type: string
        default: '.'
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
      java-distribution:
        description: 'Java distribution'
        required: false
        type: string
        default: 'temurin'
      use-maven-wrapper:
        description: 'Use ./mvnw when present; otherwise mvn'
        required: false
        type: boolean
        default: true
      maven-goals:
        description: 'Maven goals (e.g. clean verify)'
        required: false
        type: string
        default: 'clean verify'
      maven-profiles:
        description: 'Optional Maven profile(s) (comma-separated)'
        required: false
        type: string
        default: ''
      maven-extra-args:
        description: 'Extra Maven CLI arguments (default -B -ntp)'
        required: false
        type: string
        default: '-B -ntp'
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      upload-test-results:
        description: 'Upload test results artifact'
        required: false
        type: boolean
        default: true
      upload-coverage:
        description: 'Upload JaCoCo coverage artifact'
        required: false
        type: boolean
        default: false
      run-sonar:
        description: 'Run SonarCloud scan after build (requires SONAR_TOKEN)'
        required: false
        type: boolean
        default: false
      sonar-coverage-report-paths:
        description: 'JaCoCo XML paths for Sonar (comma-separated); omit if no coverage'
        required: false
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud token (required when run-sonar is true)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.run-sonar == true && '0' || '1' }}

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory == '.' && '**/pom.xml' || format('{0}/**/pom.xml', inputs.working-directory) }}

      - name: Build with Maven
        uses: ./.github/actions/run-maven
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: ${{ inputs.maven-goals }}
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: ${{ inputs.skip-tests }}
          maven-profiles: ${{ inputs.maven-profiles }}
          extra-args: ${{ inputs.maven-extra-args }}

      - name: Prepare SonarCloud scan
        id: sonar
        if: ${{ inputs.run-sonar }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          JAVA_VERSION="${{ inputs.java-version }}"
          JAVA_MAJOR=""
          if [[ "$JAVA_VERSION" =~ ^1\.([0-9]+)(\.[0-9]+)*$ ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          elif [[ "$JAVA_VERSION" =~ ^([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          fi
          if [ -n "$JAVA_MAJOR" ] && [ "$JAVA_MAJOR" -lt 11 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping SonarCloud (Java ${JAVA_VERSION} < 11)"
            exit 0
          fi
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::run-sonar is true but SONAR_TOKEN secret is not set"
            exit 1
          fi
          ARGS="-Dsonar.host.url=https://sonarcloud.io"
          ARGS="${ARGS} -Dsonar.organization=${GITHUB_REPOSITORY%%/*}"
          ARGS="${ARGS} -Dsonar.projectKey=${GITHUB_REPOSITORY##*/}"
          if [ -n "${{ inputs.sonar-coverage-report-paths }}" ]; then
            ARGS="${ARGS} -Dsonar.coverage.jacoco.xmlReportPaths=${{ inputs.sonar-coverage-report-paths }}"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"

      - name: SonarCloud Scan
        if: ${{ inputs.run-sonar && steps.sonar.outputs.skip == 'false' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: ${{ steps.sonar.outputs.args }}

      - name: Upload test results
        if: ${{ inputs.upload-test-results && !inputs.skip-tests && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.working-directory == '.' && '**/target/surefire-reports/' || format('{0}/**/target/surefire-reports/', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/failsafe-reports/' || format('{0}/**/target/failsafe-reports/', inputs.working-directory) }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage reports
        if: ${{ inputs.upload-coverage && !inputs.skip-tests && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.working-directory == '.' && '**/target/site/jacoco/' || format('{0}/**/target/site/jacoco/', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/jacoco.exec' || format('{0}/**/target/jacoco.exec', inputs.working-directory) }}
          retention-days: 7
          if-no-files-found: warn

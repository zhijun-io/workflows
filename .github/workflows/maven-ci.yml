# Reusable CI workflow for ZhiJun IO Maven projects
#
# Usage:
#   uses: zhijun-io/workflows/.github/workflows/maven-ci.yml@main
#   with:
#     java-version: '8'
#     use-maven-wrapper: false
#     staged-ci: true
#     verify-profiles: coverage

name: Maven CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Maven project root directory'
        required: false
        type: string
        default: '.'
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '21'
      java-distribution:
        description: 'Java distribution to use'
        required: false
        type: string
        default: 'temurin'
      use-maven-wrapper:
        description: 'Use ./mvnw when present; otherwise mvn'
        required: false
        type: boolean
        default: true
      maven-goals:
        description: 'Maven goals when staged-ci is false'
        required: false
        type: string
        default: 'clean verify'
      staged-ci:
        description: 'Run validate, test, then verify (Rose-style pipeline)'
        required: false
        type: boolean
        default: false
      verify-profiles:
        description: 'Maven profile for final verify step (e.g. coverage)'
        required: false
        type: string
        default: ''
      maven-threads:
        description: 'Maven -T for test/verify steps in staged-ci'
        required: false
        type: string
        default: '1'
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      upload-test-results:
        description: 'Upload test results as artifact'
        required: false
        type: boolean
        default: true
      upload-coverage:
        description: 'Upload JaCoCo coverage reports as artifact'
        required: false
        type: boolean
        default: true
      run-sonar:
        description: 'Run SonarQube analysis after build'
        required: false
        type: boolean
        default: false
      sonar-host-url:
        description: 'SonarQube host URL'
        required: false
        type: string
        default: 'https://sonarcloud.io'
      sonar-organization:
        description: 'SonarQube organization (defaults to GitHub owner)'
        required: false
        type: string
        default: ''
      sonar-project-key:
        description: 'SonarQube project key (defaults to repository name)'
        required: false
        type: string
        default: ''
      pre-build-script:
        description: 'Optional shell script to run before Maven (e.g. reclaim disk space)'
        required: false
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        description: 'SonarQube token (required when run-sonar is true)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.run-sonar == true && '0' || '1' }}

      - name: Pre-build script
        if: ${{ inputs.pre-build-script != '' }}
        shell: bash
        run: ${{ inputs.pre-build-script }}

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory == '.' && '**/pom.xml' || format('{0}/**/pom.xml', inputs.working-directory) }}

      - name: Staged CI (validate / test / verify)
        if: ${{ inputs.staged-ci }}
        uses: zhijun-io/workflows/.github/actions/run-maven@main
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: validate
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: ${{ inputs.skip-tests }}

      - name: Staged CI — test
        if: ${{ inputs.staged-ci }}
        uses: zhijun-io/workflows/.github/actions/run-maven@main
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: test
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: ${{ inputs.skip-tests }}
          threads: ${{ inputs.maven-threads }}

      - name: Staged CI — verify
        if: ${{ inputs.staged-ci }}
        uses: zhijun-io/workflows/.github/actions/run-maven@main
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: verify
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: ${{ inputs.skip-tests }}
          maven-profiles: ${{ inputs.verify-profiles }}
          threads: ${{ inputs.maven-threads }}

      - name: Build with Maven
        if: ${{ !inputs.staged-ci }}
        uses: zhijun-io/workflows/.github/actions/run-maven@main
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: ${{ inputs.maven-goals }}
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: ${{ inputs.skip-tests }}

      - name: SonarQube analysis
        if: ${{ inputs.run-sonar }}
        uses: zhijun-io/workflows/.github/actions/run-sonar@main
        with:
          working-directory: ${{ inputs.working-directory }}
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          java-version: ${{ inputs.java-version }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: ${{ inputs.sonar-host-url }}
          sonar-organization: ${{ inputs.sonar-organization }}
          sonar-project-key: ${{ inputs.sonar-project-key }}

      - name: Upload test results
        if: ${{ inputs.upload-test-results && !inputs.skip-tests && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.working-directory == '.' && '**/target/surefire-reports/' || format('{0}/**/target/surefire-reports/', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/failsafe-reports/' || format('{0}/**/target/failsafe-reports/', inputs.working-directory) }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage reports
        if: ${{ inputs.upload-coverage && !inputs.skip-tests && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.working-directory == '.' && '**/target/site/jacoco/' || format('{0}/**/target/site/jacoco/', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/jacoco.exec' || format('{0}/**/target/jacoco.exec', inputs.working-directory) }}
          retention-days: 7
          if-no-files-found: warn

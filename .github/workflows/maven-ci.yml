# Reusable CI workflow for ZhiJun IO Maven projects
#
# Minimal:
#   uses: zhijun-io/workflows/.github/workflows/maven-ci.yml@main
#
# With optional Maven profile(s) defined in your POM:
#   with:
#     java-version: '8'
#     maven-profiles: your-profile

name: Maven CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Maven project root directory'
        required: false
        type: string
        default: '.'
      java-version:
        description: 'Java version for build'
        required: false
        type: string
        default: '21'
      java-distribution:
        description: 'Java distribution'
        required: false
        type: string
        default: 'temurin'
      use-maven-wrapper:
        description: 'Use ./mvnw when present; otherwise mvn'
        required: false
        type: boolean
        default: true
      maven-goals:
        description: 'Maven goals (e.g. clean verify)'
        required: false
        type: string
        default: 'clean verify'
      maven-profiles:
        description: 'Optional Maven profile(s) (comma-separated)'
        required: false
        type: string
        default: ''
      maven-extra-args:
        description: 'Extra Maven CLI arguments (default -B -ntp)'
        required: false
        type: string
        default: '-B -ntp'
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      upload-test-results:
        description: 'Upload test results artifact'
        required: false
        type: boolean
        default: true
      upload-coverage:
        description: 'Upload JaCoCo coverage artifact'
        required: false
        type: boolean
        default: false
      run-sonar:
        description: 'Run Sonar scan in a separate job via SonarScanner for Maven (requires SONAR_TOKEN)'
        required: false
        type: boolean
        default: false
      sonar-java-version:
        description: 'Java version for Sonar job (scanner requires JDK 21+)'
        required: false
        type: string
        default: '21'
      sonar-host-url:
        description: 'Sonar server URL (SonarCloud default)'
        required: false
        type: string
        default: 'https://sonarcloud.io'
      sonar-organization:
        description: 'SonarCloud organization key; empty on SonarCloud = GitHub owner; omit on self-hosted'
        required: false
        type: string
        default: ''
      sonar-project-key:
        description: 'Sonar project key; empty = GitHub repository name'
        required: false
        type: string
        default: ''
      sonar-coverage-report-paths:
        description: 'JaCoCo XML paths for Sonar (comma-separated); omit if no coverage'
        required: false
        type: string
        default: ''
      sonar-maven-plugin-version:
        description: 'SonarScanner for Maven plugin version'
        required: false
        type: string
        default: '5.7.0.6970'
    secrets:
      SONAR_TOKEN:
        description: 'Sonar token (required when run-sonar is true)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory == '.' && '**/pom.xml' || format('{0}/**/pom.xml', inputs.working-directory) }}

      - name: Build with Maven
        uses: zhijun-io/workflows/.github/actions/run-maven@main
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: ${{ inputs.maven-goals }}
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: ${{ inputs.skip-tests }}
          maven-profiles: ${{ inputs.maven-profiles }}
          extra-args: ${{ inputs.maven-extra-args }}

      - name: Upload Sonar build outputs
        if: ${{ inputs.run-sonar }}
        uses: actions/upload-artifact@v4
        with:
          name: sonar-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.working-directory == '.' && '**/target/classes/' || format('{0}/**/target/classes/', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/jacoco.exec' || format('{0}/**/target/jacoco.exec', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/site/jacoco/' || format('{0}/**/target/site/jacoco/', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/surefire-reports/' || format('{0}/**/target/surefire-reports/', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/failsafe-reports/' || format('{0}/**/target/failsafe-reports/', inputs.working-directory) }}
          retention-days: 1
          if-no-files-found: warn

      - name: Upload test results
        if: ${{ inputs.upload-test-results && !inputs.skip-tests && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.working-directory == '.' && '**/target/surefire-reports/' || format('{0}/**/target/surefire-reports/', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/failsafe-reports/' || format('{0}/**/target/failsafe-reports/', inputs.working-directory) }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload coverage reports
        if: ${{ inputs.upload-coverage && !inputs.skip-tests && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.working-directory == '.' && '**/target/site/jacoco/' || format('{0}/**/target/site/jacoco/', inputs.working-directory) }}
            ${{ inputs.working-directory == '.' && '**/target/jacoco.exec' || format('{0}/**/target/jacoco.exec', inputs.working-directory) }}
          retention-days: 7
          if-no-files-found: warn

  sonar:
    needs: build
    if: ${{ inputs.run-sonar }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Sonar build outputs
        uses: actions/download-artifact@v4
        with:
          name: sonar-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Set up JDK ${{ inputs.sonar-java-version }} (Sonar)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.sonar-java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory == '.' && '**/pom.xml' || format('{0}/**/pom.xml', inputs.working-directory) }}

      - name: Prepare Sonar scan
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::run-sonar is true but SONAR_TOKEN secret is not set"
            exit 1
          fi
          HOST="${{ inputs.sonar-host-url }}"
          if [ -z "$HOST" ]; then
            HOST="https://sonarcloud.io"
          fi
          ORG="${{ inputs.sonar-organization }}"
          if [ -z "$ORG" ] && [[ "$HOST" == *"sonarcloud.io"* ]]; then
            ORG="${GITHUB_REPOSITORY%%/*}"
          fi
          PROJECT_KEY="${{ inputs.sonar-project-key }}"
          if [ -z "$PROJECT_KEY" ]; then
            PROJECT_KEY="${GITHUB_REPOSITORY##*/}"
          fi
          ARGS="-Dsonar.host.url=${HOST}"
          if [ -n "$ORG" ]; then
            ARGS="${ARGS} -Dsonar.organization=${ORG}"
          fi
          ARGS="${ARGS} -Dsonar.projectKey=${PROJECT_KEY}"
          if [ -n "${{ inputs.sonar-coverage-report-paths }}" ]; then
            ARGS="${ARGS} -Dsonar.coverage.jacoco.xmlReportPaths=${{ inputs.sonar-coverage-report-paths }}"
          fi
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"

      - name: Sonar analysis
        uses: zhijun-io/workflows/.github/actions/run-maven@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          working-directory: ${{ inputs.working-directory }}
          goals: org.sonarsource.scanner.maven:sonar-maven-plugin:${{ inputs.sonar-maven-plugin-version }}:sonar
          use-maven-wrapper: ${{ inputs.use-maven-wrapper }}
          skip-tests: true
          maven-profiles: ${{ inputs.maven-profiles }}
          extra-args: ${{ inputs.maven-extra-args }} ${{ steps.sonar.outputs.args }}

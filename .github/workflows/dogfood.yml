# Dogfood reusable Maven workflows against test-project/
#
# Runs on changes to workflows/actions or the test project itself.

name: Dogfood Maven Workflows

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - '.github/workflows/maven-*.yml'
      - '.github/actions/**'
      - 'test-project/**'
  pull_request:
    paths:
      - '.github/workflows/maven-*.yml'
      - '.github/actions/**'
      - 'test-project/**'

concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-default:
    name: CI (clean verify)
    uses: ./.github/workflows/maven-ci.yml
    with:
      working-directory: test-project
      use-maven-wrapper: false

  ci-staged:
    name: CI (staged validate test verify)
    uses: ./.github/workflows/maven-ci.yml
    with:
      working-directory: test-project
      use-maven-wrapper: false
      staged-ci: true

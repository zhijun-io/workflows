name: Run Maven
description: Run Maven goals with optional wrapper, profiles, threading, and working directory
inputs:
  goals:
    description: Maven goals (e.g. clean verify)
    required: true
  working-directory:
    description: Directory to run Maven from
    required: false
    default: '.'
  use-maven-wrapper:
    description: Use ./mvnw when present; otherwise mvn
    required: false
    default: 'true'
  skip-tests:
    description: Append -DskipTests
    required: false
    default: 'false'
  maven-profiles:
    description: Maven profile id(s) for -P (comma-separated, no spaces)
    required: false
    default: ''
  extra-args:
    description: Extra Maven CLI arguments
    required: false
    default: '-B -ntp'
  threads:
    description: Maven -T thread count (empty to omit)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        MVN="mvn"
        if [ "${{ inputs.use-maven-wrapper }}" = "true" ]; then
          if [ -f ./mvnw ]; then
            MVN="./mvnw"
          elif [ -n "${GITHUB_WORKSPACE:-}" ] && [ -f "${GITHUB_WORKSPACE}/mvnw" ]; then
            MVN="${GITHUB_WORKSPACE}/mvnw"
          fi
        fi
        PROFILE_ARGS=""
        if [ -n "${{ inputs.maven-profiles }}" ]; then
          PROFILE_ARGS="-P${{ inputs.maven-profiles }}"
        fi
        THREAD_ARGS=""
        if [ -n "${{ inputs.threads }}" ]; then
          THREAD_ARGS="-T${{ inputs.threads }}"
        fi
        SKIP_ARGS=""
        if [ "${{ inputs.skip-tests }}" = "true" ]; then
          SKIP_ARGS="-DskipTests"
        fi
        GPG_ARGS=()
        if [ -n "${MAVEN_GPG_PASSPHRASE:-}" ]; then
          GPG_ARGS=(-Dgpg.arg=--pinentry-mode -Dgpg.arg=loopback "-Dgpg.passphrase=${MAVEN_GPG_PASSPHRASE}")
        fi
        # shellcheck disable=SC2086
        $MVN ${{ inputs.goals }} ${{ inputs.extra-args }} ${PROFILE_ARGS} ${THREAD_ARGS} ${SKIP_ARGS} "${GPG_ARGS[@]}"

name: Verify no SNAPSHOT versions
description: Fail if any pom.xml still references SNAPSHOT versions (post release version set)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if grep -r "SNAPSHOT" --include="pom.xml" . | grep -v "/target/" | grep -v "<!--"; then
          echo "ERROR: Found SNAPSHOT references in POM files"
          exit 1
        fi
        echo "No SNAPSHOT references found in POM files"

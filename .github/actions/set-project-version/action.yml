name: Set project version
description: Set release version via mvn versions:set or <revision> property (flatten-friendly)
inputs:
  version:
    description: Target version (e.g. 0.1.0 or 0.2.0-SNAPSHOT)
    required: true
  version-property:
    description: project-version (versions:set) or revision (<revision> in pom.xml)
    required: false
    default: 'project-version'
  pom-file:
    description: POM file name or path relative to working-directory
    required: false
    default: 'pom.xml'
  working-directory:
    description: Maven project root directory
    required: false
    default: '.'
  use-maven-wrapper:
    description: Prefer ./mvnw for versions:set when available
    required: false
    default: 'true'
  process-all-modules:
    description: Pass -DprocessAllModules=true to versions:set
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        POM="${{ inputs.pom-file }}"
        if [ "${{ inputs.version-property }}" = "revision" ]; then
          if ! grep -q '<revision>' "$POM"; then
            echo "ERROR: <revision> not found in ${POM}"
            exit 1
          fi
          sed -i "s|<revision>.*</revision>|<revision>${VERSION}</revision>|" "$POM"
          echo "Set <revision> to ${VERSION} in ${POM}"
        else
          if [ "${{ inputs.use-maven-wrapper }}" = "true" ] && [ -f ./mvnw ]; then
            MVN="./mvnw"
          else
            MVN="mvn"
          fi
          MODULE_ARGS=()
          if [ "${{ inputs.process-all-modules }}" = "true" ]; then
            MODULE_ARGS=(-DprocessAllModules=true)
          fi
          $MVN -ntp versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false "${MODULE_ARGS[@]}"
        fi

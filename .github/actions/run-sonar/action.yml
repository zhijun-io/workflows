name: Run SonarQube
description: Run SonarQube analysis via Maven sonar:sonar goal
inputs:
  working-directory:
    description: Directory to run Maven from
    required: false
    default: '.'
  use-maven-wrapper:
    description: Use ./mvnw when present; otherwise mvn
    required: false
    default: 'true'
  java-version:
    description: Java version in use (SonarQube requires Java 11+)
    required: false
    default: '21'
  sonar-token:
    description: SonarQube token
    required: true
  sonar-host-url:
    description: SonarQube host URL
    required: false
    default: 'https://sonarcloud.io'
  sonar-organization:
    description: SonarQube organization (defaults to GitHub repository owner)
    required: false
    default: ''
  sonar-project-key:
    description: SonarQube project key (defaults to GitHub repository name)
    required: false
    default: ''
  extra-args:
    description: Extra Maven CLI arguments
    required: false
    default: '-B -ntp'
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: |
        set -euo pipefail

        if [ -z "$SONAR_TOKEN" ]; then
          echo "::error::SonarQube token is required but not provided (pass secrets.SONAR_TOKEN to the workflow)"
          exit 1
        fi

        JAVA_VERSION="${{ inputs.java-version }}"
        if [[ "$JAVA_VERSION" =~ ^[0-9]+$ ]] && [ "$JAVA_VERSION" -lt 11 ]; then
          echo "::warning::Skipping SonarQube analysis (Java ${JAVA_VERSION} < 11; SonarQube requires Java 11+)"
          exit 0
        fi

        if [ "${{ inputs.use-maven-wrapper }}" = "true" ] && [ -f ./mvnw ]; then
          MVN="./mvnw"
        else
          MVN="mvn"
        fi

        SONAR_ORG="${{ inputs.sonar-organization }}"
        if [ -z "$SONAR_ORG" ]; then
          SONAR_ORG="${GITHUB_REPOSITORY%%/*}"
        fi

        SONAR_PROJECT="${{ inputs.sonar-project-key }}"
        if [ -z "$SONAR_PROJECT" ]; then
          SONAR_PROJECT="${GITHUB_REPOSITORY##*/}"
        fi

        $MVN sonar:sonar \
          -Dsonar.host.url="${{ inputs.sonar-host-url }}" \
          -Dsonar.organization="$SONAR_ORG" \
          -Dsonar.projectKey="$SONAR_PROJECT" \
          -Dsonar.token="$SONAR_TOKEN" \
          ${{ inputs.extra-args }}

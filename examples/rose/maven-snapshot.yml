# SNAPSHOT publish for Rose
# Place at .github/workflows/maven-snapshot.yml in zhijun-io/rose

name: Maven Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  publish:
    uses: zhijun-io/workflows/.github/workflows/maven-snapshot.yml@main
    with:
      java-version: '8'
      use-maven-wrapper: false
      verify-profiles: coverage
      release-profile: true
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
